# FS Mod Manager Configuration

[game_directories]
# Set paths to your Farming Simulator game directories
# fs17 = "/path/to/FS17"
# fs19 = "/path/to/FS19"
# fs22 = "/path/to/FS22"
# fs25 = "/path/to/FS25"

[mod_sources]
# Configure mod sources
[[mod_sources.mod_hub]]
name = "Mod Hub"
url = "https://modhub.farming-simulator.com"
enabled = true
api_key = ""

[[mod_sources.github]]
name = "GitHub"
url = "https://api.github.com"
enabled = true
api_key = ""

[[mod_sources.kingmods]]
name = "KingMods"
url = "https://www.kingmods.com"
enabled = true
api_key = ""

[settings]
# Archive directory (inactive mods)
archive_directory = "~/.config/fs-mod-manager/Archive"
# Active directory (active mods)
active_directory = "~/.config/fs-mod-manager/Active"
# Auto-update mods when checking
auto_update = true
# Check for mod conflicts
check_conflicts = true
# Number of parallel scans
parallel_scans = 4
# Cache time-to-live in hours
cache_ttl_hours = 24