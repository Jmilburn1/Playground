name: Release

# Build the Windows exe and attach it to a GitHub Release whenever
# a version tag (v1.0.0, v1.1.0, ...) is pushed. Can also be run
# manually from the Actions tab (workflow_dispatch) — then the exe
# is saved as a build artifact instead of a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Build release exe
        run: cargo build --release

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/playground.exe dist/
          # update.exe rides along: the app self-update
          # (v1.4.2+) swaps BOTH binaries from this zip —
          # without it here, installed helpers could never
          # be updated.
          Copy-Item target/release/update.exe dist/
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath Playground-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playground-Windows
          path: Playground-Windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --generate-notes }
          gh release upload $tag Playground-Windows.zip --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Iced build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libfontconfig1-dev

      - name: Build release binaries
        run: cargo build --release

      - name: Package zip
        run: |
          mkdir -p dist
          cp target/release/playground dist/
          # update rides along: the app self-update swaps
          # BOTH binaries from this zip (same rule as the
          # Windows package).
          cp target/release/update dist/
          cp README.md dist/ || true
          cp packaging/linux/install.sh dist/
          cp packaging/linux/playground.desktop dist/
          cp assets/logo_sidebar.png dist/playground.png
          chmod +x dist/install.sh dist/playground dist/update
          cd dist && zip -r ../Playground-Linux.zip . && cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playground-Linux
          path: Playground-Linux.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" 2>/dev/null || gh release create "$tag" --generate-notes
          gh release upload "$tag" Playground-Linux.zip --clobber
