[package]
name = "fs-mod-manager"
version = "1.1.2"
edition = "2021"

[dependencies]
# GUI
iced = { version = "0.13", features = ["tokio", "image"] }
iced_aw = "0.11"
iced_runtime = "0.13"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system
walkdir = "2"
zip = "4"

# Utilities
anyhow = "1.0"
rfd = "0.15"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
toml = "0.8"
futures = "0.3"
async-trait = "0.1"
rayon = "1.7"
once_cell = "1.19"
serde_bytes = "0.11"
quick-xml = "0.36"
image_dds = { version = "0.6", default-features = false, features = ["ddsfile", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
